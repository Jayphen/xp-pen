name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build app bundle
        run: ./menubar_app/scripts/build-app.sh ${{ steps.version.outputs.VERSION }}

      - name: Build Swift HID helper
        run: cd hid_helper && swift build -c release

      - name: Package HID helper
        run: |
          mkdir -p dist
          cp hid_helper/.build/release/hid_helper dist/
          cd dist && zip hid_helper-${{ steps.version.outputs.VERSION }}.zip hid_helper

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            menubar_app/build/XP-Pen-Remote-${{ steps.version.outputs.VERSION }}.zip
            dist/hid_helper-${{ steps.version.outputs.VERSION }}.zip
